[package]
name = "ytfx"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
bytemuck = { version = "1", features = ["derive"] }
cpal = "0.15"
libc = "0.2.191"
pollster = "0.4"
ratatui = "0.29"
rustfft = "6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "metal"] }

# OS media keys and "Now Playing": MPRemoteCommandCenter on macOS (straight through objc2,
# which wgpu already uses), MPRIS (pure-Rust zbus) on Linux.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSObject", "NSString", "NSURL", "NSValue"] }
objc2-media-player = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }
