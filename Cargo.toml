[package]
name = "ytfx"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
bytemuck = { version = "1", features = ["derive"] }
cpal = "0.15"
libc = "0.2.191"
pollster = "0.4"
ratatui = "0.29"
rustfft = "6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "metal"] }

# OS media keys and "Now Playing": MPRemoteCommandCenter on macOS, MPRIS (pure-Rust zbus) on Linux.
[target.'cfg(target_os = "macos")'.dependencies]
souvlaki = "0.9.3"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }
